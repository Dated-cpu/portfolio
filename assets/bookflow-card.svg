<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="BookFlow AI — backend architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#0d141c"/>
    </linearGradient>
    <radialGradient id="warm" cx="80%" cy="10%" r="60%">
      <stop offset="0" stop-color="#d98a4a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d98a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98a4a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#efe6d6" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>
  <rect width="1000" height="700" fill="url(#warm)"/>

  <g font-family="Manrope, Inter, Segoe UI, Arial, sans-serif">
    <text x="60" y="88" font-size="11" font-weight="700" letter-spacing="0.2em" fill="#d98a4a">BACKEND · SQL · API</text>
    <text x="60" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="500" letter-spacing="-0.02em" fill="#efe6d6">BookFlow AI</text>
    <text x="60" y="186" font-size="16" fill="#a9a294">Scheduling &amp; appointment SaaS foundation</text>

    <g font-size="11" font-weight="600" letter-spacing="0.08em">
      <rect x="60" y="222" width="140" height="30" rx="2" fill="none" stroke="#4a3a2c"/>
      <text x="130" y="241" fill="#efe6d6" text-anchor="middle">FASTAPI</text>
      <rect x="212" y="222" width="150" height="30" rx="2" fill="none" stroke="#4a3a2c"/>
      <text x="287" y="241" fill="#efe6d6" text-anchor="middle">POSTGRESQL</text>
      <rect x="374" y="222" width="150" height="30" rx="2" fill="none" stroke="#4a3a2c"/>
      <text x="449" y="241" fill="#efe6d6" text-anchor="middle">SQLALCHEMY 2</text>
      <rect x="536" y="222" width="190" height="30" rx="2" fill="none" stroke="#4a3a2c"/>
      <text x="631" y="241" fill="#d98a4a" text-anchor="middle">CLEAN ARCHITECTURE</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="60" y="300" width="880" height="300" rx="2" fill="#0b1118" stroke="#2a241d"/>
    </g>

    <g font-family="Manrope, Inter, Segoe UI, Arial, sans-serif" font-size="11">
      <rect x="90" y="336" width="170" height="86" rx="2" fill="none" stroke="#3a3026"/>
      <text x="175" y="369" fill="#d98a4a" font-size="9" font-weight="700" letter-spacing="0.14em" text-anchor="middle">DOMAIN</text>
      <text x="175" y="390" fill="#efe6d6" text-anchor="middle">Entities · interfaces</text>
      <text x="175" y="407" fill="#7c776d" text-anchor="middle">zero framework deps</text>

      <rect x="300" y="336" width="170" height="86" rx="2" fill="none" stroke="#3a3026"/>
      <text x="385" y="369" fill="#d98a4a" font-size="9" font-weight="700" letter-spacing="0.14em" text-anchor="middle">APPLICATION</text>
      <text x="385" y="390" fill="#efe6d6" text-anchor="middle">Use cases · DTO</text>
      <text x="385" y="407" fill="#7c776d" text-anchor="middle">repository ports</text>

      <rect x="510" y="336" width="180" height="86" rx="2" fill="none" stroke="#3a3026"/>
      <text x="600" y="369" fill="#d98a4a" font-size="9" font-weight="700" letter-spacing="0.14em" text-anchor="middle">INFRASTRUCTURE</text>
      <text x="600" y="390" fill="#efe6d6" text-anchor="middle">Postgres · JWT · DI</text>
      <text x="600" y="407" fill="#7c776d" text-anchor="middle">async engine</text>

      <rect x="730" y="336" width="170" height="86" rx="2" fill="none" stroke="#3a3026"/>
      <text x="815" y="369" fill="#d98a4a" font-size="9" font-weight="700" letter-spacing="0.14em" text-anchor="middle">PRESENTATION</text>
      <text x="815" y="390" fill="#efe6d6" text-anchor="middle">FastAPI routers</text>
      <text x="815" y="407" fill="#7c776d" text-anchor="middle">schemas · validation</text>
    </g>

    <g stroke="url(#line)" stroke-width="1.5" fill="none">
      <line x1="260" y1="379" x2="296" y2="379"/>
      <line x1="470" y1="379" x2="506" y2="379"/>
      <line x1="690" y1="379" x2="726" y2="379"/>
    </g>

    <g transform="translate(90 470)">
      <ellipse cx="50" cy="10" rx="44" ry="14" fill="none" stroke="#4a3a2c"/>
      <path d="M6 10 V64 C6 78 94 78 94 64 V10" fill="none" stroke="#4a3a2c"/>
      <path d="M6 32 C6 46 94 46 94 32" fill="none" stroke="#4a3a2c" opacity="0.7"/>
      <path d="M6 48 C6 62 94 62 94 48" fill="none" stroke="#4a3a2c" opacity="0.5"/>
      <text x="50" y="96" fill="#7c776d" font-size="9" font-weight="700" letter-spacing="0.1em" text-anchor="middle">POSTGRESQL</text>
    </g>

    <g transform="translate(220 470)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <rect width="690" height="92" rx="2" fill="#070b10" stroke="#2a241d"/>
      <text x="18" y="24" fill="#7c776d">$ make docker-up</text>
      <text x="18" y="44" fill="#7c776d">$ make migrate</text>
      <text x="18" y="64" fill="#d98a4a">✓ PostgreSQL ready · migrations applied</text>
      <text x="18" y="82" fill="#efe6d6">✓ FastAPI · /docs · tests · Ruff · mypy</text>
    </g>

    <text x="60" y="650" fill="#7c776d" font-size="10" letter-spacing="0.04em">Domain → Application → Infrastructure → Presentation. Зависимости только внутрь.</text>
  </g>
</svg>
