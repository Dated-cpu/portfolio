<svg xmlns="http://www.w3.org/2000/svg" width="820" height="920" viewBox="0 0 820 920" role="img" aria-label="Интерфейс Telegram Mini App Трендыч">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cover1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cover2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="820" height="920" fill="none"/>
  <circle cx="690" cy="140" r="180" fill="#22d3ee" opacity="0.05"/>
  <circle cx="90" cy="780" r="200" fill="#8b5cf6" opacity="0.06"/>

  <!-- phone -->
  <g filter="url(#phoneShadow)">
    <rect x="220" y="40" width="380" height="840" rx="52" fill="#08080e" stroke="#2a2440" stroke-width="1.5"/>
    <rect x="234" y="54" width="352" height="812" rx="42" fill="#0a0a0f"/>
  </g>

  <!-- dynamic island -->
  <rect x="366" y="66" width="88" height="24" rx="12" fill="#050509"/>

  <!-- screen glow -->
  <rect x="234" y="54" width="352" height="300" rx="42" fill="url(#topGlow)"/>

  <!-- status bar -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#f5f5f7">
    <text x="266" y="82" font-size="11" font-weight="700">9:41</text>
    <g transform="translate(500 72)" fill="#f5f5f7">
      <rect x="0" y="6" width="3" height="5" rx="1"/>
      <rect x="5" y="4" width="3" height="7" rx="1"/>
      <rect x="10" y="2" width="3" height="9" rx="1"/>
      <rect x="18" y="3" width="14" height="7" rx="2" fill="none" stroke="#f5f5f7" stroke-width="1.2"/>
      <rect x="20" y="5" width="9" height="3" rx="1"/>
    </g>
  </g>

  <!-- top bar -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="252" y="100" width="34" height="34" rx="11" fill="url(#brand)"/>
    <text x="269" y="123" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Т</text>
    <text x="294" y="116" font-size="14.5" font-weight="700" fill="#f5f5f7">Трендыч</text>
    <text x="294" y="131" font-size="10" fill="#8c8ca1">AI-видео прямо в Telegram</text>
    <rect x="480" y="100" width="88" height="30" rx="15" fill="#14141c" stroke="#2a2a3a"/>
    <text x="524" y="120" font-size="11.5" font-weight="700" fill="#f5f5f7" text-anchor="middle">320 ★</text>
  </g>

  <!-- hero -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="252" y="174" font-size="23" font-weight="800" fill="#f5f5f7">Повтори любой</text>
    <text x="252" y="202" font-size="23" font-weight="800" fill="#f5f5f7">тренд за пару минут</text>
    <text x="252" y="226" font-size="10.2" fill="#8c8ca1">Выберите шаблон, загрузите фото —</text>
    <text x="252" y="240" font-size="10.2" fill="#8c8ca1">модель соберёт вертикальное видео 9:16.</text>
  </g>

  <!-- stats -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="252" y="278" font-size="17" font-weight="800" fill="#f5f5f7">6</text>
    <text x="252" y="292" font-size="8.5" fill="#6f6f85">шаблонов</text>
    <text x="330" y="278" font-size="17" font-weight="800" fill="#f5f5f7">9:16</text>
    <text x="330" y="292" font-size="8.5" fill="#6f6f85">формат</text>
    <text x="398" y="278" font-size="17" font-weight="800" fill="#f5f5f7">2 мин</text>
    <text x="398" y="292" font-size="8.5" fill="#6f6f85">на ролик</text>
  </g>

  <!-- chips -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="600">
    <rect x="252" y="316" width="40" height="24" rx="12" fill="#f5f5f7"/>
    <text x="272" y="331" fill="#0a0a0f" text-anchor="middle">Все</text>
    <rect x="298" y="316" width="58" height="24" rx="12" fill="#14141c" stroke="#2a2a3a"/>
    <text x="327" y="331" fill="#8c8ca1" text-anchor="middle">Тренды</text>
    <rect x="362" y="316" width="62" height="24" rx="12" fill="#14141c" stroke="#2a2a3a"/>
    <text x="393" y="331" fill="#8c8ca1" text-anchor="middle">Быстрые</text>
    <rect x="430" y="316" width="64" height="24" rx="12" fill="#14141c" stroke="#2a2a3a"/>
    <text x="462" y="331" fill="#8c8ca1" text-anchor="middle">Локации</text>
  </g>

  <!-- card 1 -->
  <g filter="url(#softShadow)">
    <rect x="252" y="360" width="316" height="184" rx="18" fill="#14141c" stroke="#242434"/>
  </g>
  <rect x="252" y="360" width="316" height="98" rx="18" fill="url(#cover1)"/>
  <rect x="252" y="438" width="316" height="20" fill="#14141c"/>
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="392" cy="414" rx="13" ry="11"/>
    <circle cx="372" cy="398" r="5"/>
    <circle cx="385" cy="394" r="5"/>
    <circle cx="399" cy="394" r="5"/>
    <circle cx="412" cy="398" r="5"/>
  </g>
  <rect x="520" y="374" width="34" height="18" rx="9" fill="#ffffff" opacity="0.18"/>
  <text x="537" y="387" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">ХИТ</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="268" y="478" font-size="13" font-weight="700" fill="#f5f5f7">Танец с питомцем</text>
    <text x="268" y="495" font-size="9" fill="#8c8ca1">Любимый тренд, где вы и ваш пёс в такт</text>
    <rect x="268" y="508" width="45" height="18" rx="9" fill="#1f1f2b"/>
    <text x="290" y="520" font-size="8" fill="#bdbdd0" text-anchor="middle">5 фото</text>
    <rect x="319" y="508" width="42" height="18" rx="9" fill="#1f1f2b"/>
    <text x="340" y="520" font-size="8" fill="#bdbdd0" text-anchor="middle">8 сек</text>
    <text x="548" y="520" font-size="12" font-weight="800" fill="#f5f5f7" text-anchor="end">199 ★</text>
  </g>

  <!-- card 2 -->
  <g filter="url(#softShadow)">
    <rect x="252" y="560" width="316" height="184" rx="18" fill="#14141c" stroke="#242434"/>
  </g>
  <rect x="252" y="560" width="316" height="98" rx="18" fill="url(#cover2)"/>
  <rect x="252" y="638" width="316" height="20" fill="#14141c"/>
  <g fill="#ffffff" opacity="0.95">
    <path d="M392 584 L397 602 L415 607 L397 612 L392 630 L387 612 L369 607 L387 602 Z"/>
    <path d="M373 578 L375 584 L381 586 L375 588 L373 594 L371 588 L365 586 L371 584 Z" opacity="0.8"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="268" y="678" font-size="13" font-weight="700" fill="#f5f5f7">Оживи фото</text>
    <text x="268" y="695" font-size="9" fill="#8c8ca1">Одно фото превращается в живое видео</text>
    <rect x="268" y="708" width="45" height="18" rx="9" fill="#1f1f2b"/>
    <text x="290" y="720" font-size="8" fill="#bdbdd0" text-anchor="middle">1 фото</text>
    <rect x="319" y="708" width="42" height="18" rx="9" fill="#1f1f2b"/>
    <text x="340" y="720" font-size="8" fill="#bdbdd0" text-anchor="middle">5 сек</text>
    <text x="548" y="720" font-size="12" font-weight="800" fill="#f5f5f7" text-anchor="end">99 ★</text>
  </g>

  <!-- tab bar -->
  <rect x="234" y="790" width="352" height="76" fill="#0f0f17"/>
  <line x1="234" y1="790" x2="586" y2="790" stroke="#242434"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.5" text-anchor="middle">
    <g fill="#8b5cf6">
      <rect x="292" y="806" width="8" height="8" rx="2"/>
      <rect x="303" y="806" width="8" height="8" rx="2"/>
      <rect x="292" y="817" width="8" height="8" rx="2"/>
      <rect x="303" y="817" width="8" height="8" rx="2"/>
    </g>
    <text x="302" y="844" fill="#8b5cf6" font-weight="700">Каталог</text>
    <g fill="none" stroke="#6b6b80" stroke-width="1.6">
      <circle cx="400" cy="816" r="8"/>
      <path d="M400 811 V816 L404 819"/>
    </g>
    <text x="400" y="844" fill="#6b6b80">История</text>
    <g fill="none" stroke="#6b6b80" stroke-width="1.6">
      <rect x="489" y="807" width="16" height="13" rx="3"/>
      <path d="M489 812 H505"/>
    </g>
    <circle cx="500" cy="817" r="1.6" fill="#6b6b80"/>
    <text x="497" y="844" fill="#6b6b80">Кошелёк</text>
  </g>

  <!-- floating badges -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">
    <g filter="url(#softShadow)">
      <rect x="40" y="170" width="104" height="34" rx="17" fill="#0f1624" stroke="#2a3a50"/>
      <circle cx="58" cy="187" r="4" fill="#059669"/>
      <text x="70" y="191" fill="#cfe3f7">FastAPI</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="640" y="210" width="112" height="34" rx="17" fill="#0f1624" stroke="#2a3a50"/>
      <circle cx="658" cy="227" r="4" fill="#61dafb"/>
      <text x="670" y="231" fill="#cfe3f7">React 19</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="632" y="540" width="132" height="34" rx="17" fill="#0f1624" stroke="#2a3a50"/>
      <circle cx="650" cy="557" r="4" fill="#ea4b71"/>
      <text x="662" y="561" fill="#cfe3f7">n8n pipeline</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="28" y="640" width="146" height="34" rx="17" fill="#0f1624" stroke="#2a3a50"/>
      <circle cx="46" cy="657" r="4" fill="#fbbf24"/>
      <text x="58" y="661" fill="#cfe3f7">Telegram Stars</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="636" y="700" width="112" height="34" rx="17" fill="#0f1624" stroke="#2a3a50"/>
      <circle cx="654" cy="717" r="4" fill="#8b5cf6"/>
      <text x="666" y="721" fill="#cfe3f7">9:16 video</text>
    </g>
  </g>
</svg>
