<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="Digital Love Experience — creative frontend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120711"/>
      <stop offset="1" stop-color="#1d0b25"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>
  <circle cx="820" cy="180" r="260" fill="url(#glow)"/>
  <circle cx="160" cy="600" r="240" fill="#8b5cf6" opacity="0.08"/>

  <!-- floating particles -->
  <g fill="#fb7185">
    <circle cx="140" cy="140" r="3" opacity="0.7"/>
    <circle cx="260" cy="90" r="2" opacity="0.5"/>
    <circle cx="880" cy="480" r="3" opacity="0.6"/>
    <circle cx="790" cy="610" r="2" opacity="0.5"/>
    <circle cx="620" cy="110" r="2" opacity="0.6"/>
    <circle cx="420" cy="620" r="3" opacity="0.4"/>
  </g>
  <g fill="#e879f9" opacity="0.6">
    <circle cx="700" cy="90" r="2"/>
    <circle cx="930" cy="340" r="2"/>
    <circle cx="80" cy="420" r="2"/>
    <circle cx="340" cy="200" r="2"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="60" y="88" font-size="12" font-weight="800" letter-spacing="0.18em" fill="#fb7185">CREATIVE FRONTEND</text>
    <text x="60" y="156" font-size="52" font-weight="800" letter-spacing="-0.05em" fill="#fff1f5">Digital Love</text>
    <text x="60" y="210" font-size="52" font-weight="800" letter-spacing="-0.05em" fill="url(#rose)">Experience</text>
    <text x="60" y="248" font-size="17" fill="#d8a9c8">Кинематографичный сайт-подарок с 3D-галереей и анимациями</text>

    <g font-size="12" font-weight="600">
      <rect x="60" y="286" width="130" height="32" rx="16" fill="rgba(251,113,133,0.08)" stroke="#6e2f49"/>
      <text x="125" y="307" fill="#fda4af" text-anchor="middle">Next.js</text>
      <rect x="202" y="286" width="130" height="32" rx="16" fill="rgba(232,121,249,0.08)" stroke="#6b3a75"/>
      <text x="267" y="307" fill="#f0abfc" text-anchor="middle">TypeScript</text>
      <rect x="344" y="286" width="150" height="32" rx="16" fill="rgba(139,92,246,0.08)" stroke="#463184"/>
      <text x="419" y="307" fill="#c4b5fd" text-anchor="middle">Motion</text>
    </g>

    <!-- glass cards -->
    <g filter="url(#soft)">
      <rect x="60" y="360" width="270" height="220" rx="22" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.13)"/>
      <rect x="350" y="360" width="270" height="220" rx="22" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.13)"/>
      <rect x="640" y="360" width="300" height="220" rx="22" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.13)"/>
    </g>

    <g transform="translate(90 400)">
      <path d="M40 54 C40 34, 68 26, 82 44 C96 26, 124 34, 124 54 C124 78, 82 102, 82 102 C82 102, 40 78, 40 54 Z" fill="url(#rose)" opacity="0.9"/>
      <text x="0" y="140" font-size="15" font-weight="700" fill="#fff1f5">3D gallery</text>
      <text x="0" y="162" font-size="11" fill="#b98aa8">tilt · parallax · hover</text>
    </g>

    <g transform="translate(380 400)">
      <circle cx="42" cy="42" r="30" fill="none" stroke="#e879f9" stroke-width="2" opacity="0.8"/>
      <circle cx="42" cy="42" r="8" fill="#fb7185"/>
      <line x1="42" y1="72" x2="42" y2="92" stroke="#e879f9" stroke-width="2" opacity="0.6"/>
      <text x="0" y="140" font-size="15" font-weight="700" fill="#fff1f5">Timeline</text>
      <text x="0" y="162" font-size="11" fill="#b98aa8">staggered reveal</text>
    </g>

    <g transform="translate(670 400)">
      <g fill="#fb7185" opacity="0.9">
        <circle cx="18" cy="18" r="3"/>
        <circle cx="60" cy="8" r="2"/>
        <circle cx="100" cy="28" r="3"/>
        <circle cx="140" cy="12" r="2"/>
        <circle cx="170" cy="40" r="3"/>
        <circle cx="40" cy="54" r="2"/>
        <circle cx="90" cy="66" r="2"/>
        <circle cx="150" cy="70" r="2"/>
      </g>
      <text x="0" y="140" font-size="15" font-weight="700" fill="#fff1f5">Particles</text>
      <text x="0" y="162" font-size="11" fill="#b98aa8">confetti · hearts</text>
    </g>

    <text x="60" y="640" fill="#8f647f" font-size="11">Glassmorphism · reduced-motion · responsive · премиальные анимации</text>
  </g>
</svg>
