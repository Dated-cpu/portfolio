<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-label="Превью карточки заявки в Telegram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e1a"/>
      <stop offset="1" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17263d"/>
      <stop offset="1" stop-color="#132033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="720" fill="url(#bg)"/>
  <circle cx="890" cy="70" r="150" fill="#22d3ee" opacity="0.06"/>
  <circle cx="80" cy="670" r="190" fill="#34d399" opacity="0.05"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="36" y="46" fill="#e6f1ff" font-size="22" font-weight="700">AI Request Desk</text>
    <text x="36" y="70" fill="#7f93ad" font-size="13">n8n · Telegram · OpenRouter · PostgreSQL</text>
    <g transform="translate(880 28)">
      <rect width="84" height="30" rx="15" fill="#122033" stroke="#22344f"/>
      <circle cx="16" cy="15" r="4" fill="#34d399"/>
      <text x="28" y="20" fill="#9fb3cc" font-size="11" font-weight="600">online</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="36" y="96" width="700" height="552" rx="22" fill="url(#card)" stroke="#233752"/>
    </g>

    <g transform="translate(64 128)">
      <text x="0" y="0" fill="#f3f8ff" font-size="23" font-weight="700">Новая заявка #128</text>
      <g transform="translate(0 20)">
        <rect width="116" height="26" rx="13" fill="#3a1721" stroke="#7f2d3d"/>
        <text x="12" y="18" fill="#ff9aa9" font-size="11" font-weight="700">КРИТИЧНЫЙ</text>
        <rect x="124" width="104" height="26" rx="13" fill="#122a3f" stroke="#245078"/>
        <text x="137" y="18" fill="#7dd3fc" font-size="11" font-weight="700">ПОДДЕРЖКА</text>
      </g>
    </g>

    <text x="64" y="196" fill="#8ba1bb" font-size="12">SLA до 15:14 МСК</text>
    <text x="196" y="196" fill="#8ba1bb" font-size="12">·</text>
    <text x="210" y="196" fill="#8ba1bb" font-size="12">уверенность AI 97%</text>
    <text x="380" y="196" fill="#8ba1bb" font-size="12">·</text>
    <text x="394" y="196" fill="#fbbf24" font-size="12" font-weight="600">тональность негативная</text>

    <line x1="64" y1="216" x2="708" y2="216" stroke="#22344d"/>

    <text x="64" y="246" fill="#6f849d" font-size="10" font-weight="700" letter-spacing="1.4">КРАТКО</text>
    <text x="64" y="271" fill="#dbe8f7" font-size="15">Сайт недоступен, клиенты не могут оформлять заказы.</text>
    <text x="64" y="293" fill="#dbe8f7" font-size="15">Потеряны продажи, нужна срочная реакция.</text>

    <text x="64" y="332" fill="#6f849d" font-size="10" font-weight="700" letter-spacing="1.4">ТЕКСТ ЗАЯВКИ</text>
    <g filter="url(#soft)">
      <rect x="64" y="346" width="644" height="92" rx="12" fill="#0e1929" stroke="#21334b"/>
      <rect x="64" y="346" width="4" height="92" rx="2" fill="url(#accent)"/>
    </g>
    <text x="82" y="374" fill="#b9cbe0" font-size="14">Срочно! Сайт не открывается, клиенты не могут оформить заказ.</text>
    <text x="82" y="397" fill="#b9cbe0" font-size="14">Потеряли уже несколько продаж. Проверьте, пожалуйста,</text>
    <text x="82" y="420" fill="#b9cbe0" font-size="14">как можно быстрее.</text>

    <text x="64" y="472" fill="#6f849d" font-size="10" font-weight="700" letter-spacing="1.4">КЛИЕНТ</text>
    <text x="64" y="496" fill="#e6f1ff" font-size="14" font-weight="600">Ольга Максимова</text>
    <text x="196" y="496" fill="#7dd3fc" font-size="14">@olga_m</text>
    <text x="64" y="518" fill="#7f93ad" font-size="12">Telegram · сообщение 502 · 16.11.2026, 15:09</text>

    <g transform="translate(64 550)">
      <rect width="200" height="48" rx="12" fill="url(#accent)"/>
      <text x="100" y="29" fill="#06241b" font-size="13" font-weight="700" text-anchor="middle">Взять в работу</text>
      <rect x="212" width="132" height="48" rx="12" fill="#1b2c44" stroke="#2a405c"/>
      <text x="278" y="29" fill="#c6d6e8" font-size="13" font-weight="600" text-anchor="middle">Закрыть</text>
      <rect x="356" width="104" height="48" rx="12" fill="#1b2c44" stroke="#2a405c"/>
      <text x="408" y="29" fill="#94a9c1" font-size="13" font-weight="600" text-anchor="middle">Спам</text>
    </g>
    <text x="64" y="622" fill="#5f748c" font-size="11">Кнопки обновляют статус в PostgreSQL и редактируют карточку на месте.</text>

    <g transform="translate(768 96)">
      <rect width="196" height="552" rx="22" fill="#0d1828" stroke="#1c2d45"/>
      <text x="20" y="34" fill="#e6f1ff" font-size="13" font-weight="700">Пайплайн</text>

      <g transform="translate(20 60)">
        <circle cx="12" cy="12" r="12" fill="#12314a" stroke="#245078"/>
        <text x="12" y="16" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <text x="34" y="10" fill="#dbe8f7" font-size="12" font-weight="600">Telegram</text>
        <text x="34" y="26" fill="#6f849d" font-size="10">приём сообщения</text>
        <line x1="12" y1="24" x2="12" y2="62" stroke="#245078" stroke-dasharray="3 4"/>

        <circle cx="12" cy="74" r="12" fill="#12314a" stroke="#245078"/>
        <text x="12" y="78" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">2</text>
        <text x="34" y="72" fill="#dbe8f7" font-size="12" font-weight="600">OpenRouter</text>
        <text x="34" y="88" fill="#6f849d" font-size="10">категория + приоритет</text>
        <line x1="12" y1="86" x2="12" y2="124" stroke="#245078" stroke-dasharray="3 4"/>

        <circle cx="12" cy="136" r="12" fill="#12314a" stroke="#245078"/>
        <text x="12" y="140" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">3</text>
        <text x="34" y="134" fill="#dbe8f7" font-size="12" font-weight="600">PostgreSQL</text>
        <text x="34" y="150" fill="#6f849d" font-size="10">заявка, SLA, стоимость</text>
        <line x1="12" y1="148" x2="12" y2="186" stroke="#245078" stroke-dasharray="3 4"/>

        <circle cx="12" cy="198" r="12" fill="#12314a" stroke="#245078"/>
        <text x="12" y="202" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="34" y="196" fill="#dbe8f7" font-size="12" font-weight="600">Менеджер</text>
        <text x="34" y="212" fill="#6f849d" font-size="10">кнопки статуса</text>
      </g>

      <line x1="20" y1="300" x2="176" y2="300" stroke="#1c2d45"/>

      <text x="20" y="330" fill="#6f849d" font-size="10" font-weight="700" letter-spacing="1.2">СТОИМОСТЬ</text>
      <text x="20" y="360" fill="#34d399" font-size="20" font-weight="700">~$0.00004</text>
      <text x="20" y="379" fill="#7f93ad" font-size="11">за одну заявку</text>

      <rect x="20" y="400" width="156" height="56" rx="12" fill="#102036" stroke="#1e334d"/>
      <text x="32" y="422" fill="#8ba1bb" font-size="10">1 000 заявок</text>
      <text x="32" y="442" fill="#e6f1ff" font-size="14" font-weight="700">≈ $0.04</text>

      <rect x="20" y="468" width="156" height="56" rx="12" fill="#102036" stroke="#1e334d"/>
      <text x="32" y="490" fill="#8ba1bb" font-size="10">3 000 заявок / мес</text>
      <text x="32" y="510" fill="#e6f1ff" font-size="14" font-weight="700">≈ $0.06</text>
    </g>
  </g>
</svg>
