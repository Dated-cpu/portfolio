<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-label="Ночная архитектура: тёплый свет, луна и дождь">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <radialGradient id="moon" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffe0b0"/>
      <stop offset="0.45" stop-color="#f0b36b"/>
      <stop offset="1" stop-color="#c96f3f"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0a35c" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#d97745" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d97745" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1824"/>
      <stop offset="1" stop-color="#0a111a"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a121b"/>
      <stop offset="1" stop-color="#060a10"/>
    </linearGradient>
    <linearGradient id="temple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#d98a4a"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb4c7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9fb4c7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#9fb4c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1200" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#d9e6f2" opacity="0.5">
    <circle cx="120" cy="120" r="1.2"/>
    <circle cx="220" cy="80" r="1"/>
    <circle cx="330" cy="150" r="1.4"/>
    <circle cx="470" cy="90" r="1"/>
    <circle cx="560" cy="180" r="1.2"/>
    <circle cx="760" cy="100" r="1"/>
    <circle cx="880" cy="200" r="1.3"/>
    <circle cx="80" cy="300" r="1"/>
    <circle cx="940" cy="360" r="1.1"/>
    <circle cx="180" cy="420" r="1"/>
  </g>

  <!-- moon glow -->
  <circle cx="700" cy="300" r="300" fill="url(#moonGlow)"/>
  <circle cx="700" cy="300" r="190" fill="url(#moon)" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="700" cy="300" r="150" fill="url(#moon)"/>
  <g fill="#b9653a" opacity="0.18">
    <circle cx="660" cy="260" r="18"/>
    <circle cx="735" cy="330" r="12"/>
    <circle cx="690" cy="360" r="8"/>
    <circle cx="750" cy="250" r="6"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 720 L120 620 L230 700 L340 590 L470 710 L600 640 L720 720 L840 650 L1000 740 V1200 H0 Z" fill="url(#mountainFar)"/>
  <path d="M0 820 L150 720 L280 800 L420 700 L560 810 L700 740 L860 830 L1000 780 V1200 H0 Z" fill="url(#mountainNear)" opacity="0.9"/>

  <!-- mist bands -->
  <rect x="0" y="760" width="1000" height="90" fill="url(#mist)"/>
  <rect x="0" y="900" width="1000" height="70" fill="url(#mist)" opacity="0.7"/>

  <!-- temple / architecture -->
  <g>
    <!-- roof -->
    <path d="M180 760 Q500 640 820 760 L790 800 Q500 700 210 800 Z" fill="url(#temple)"/>
    <path d="M210 800 Q500 700 790 800 L780 820 Q500 730 220 820 Z" fill="#0a0f16"/>
    <!-- upper structure -->
    <rect x="300" y="800" width="400" height="150" fill="url(#temple)"/>
    <rect x="330" y="820" width="340" height="110" fill="#070b11"/>
    <!-- warm windows -->
    <g fill="url(#window)">
      <rect x="350" y="840" width="34" height="58" rx="2" opacity="0.9"/>
      <rect x="400" y="840" width="34" height="58" rx="2" opacity="0.75"/>
      <rect x="450" y="840" width="34" height="58" rx="2" opacity="0.9"/>
      <rect x="500" y="840" width="34" height="58" rx="2" opacity="0.65"/>
      <rect x="550" y="840" width="34" height="58" rx="2" opacity="0.85"/>
      <rect x="600" y="840" width="34" height="58" rx="2" opacity="0.7"/>
    </g>
    <!-- pillars -->
    <g fill="#05080d">
      <rect x="300" y="800" width="18" height="150"/>
      <rect x="682" y="800" width="18" height="150"/>
      <rect x="380" y="800" width="10" height="150"/>
      <rect x="610" y="800" width="10" height="150"/>
    </g>
    <!-- lower platform -->
    <rect x="250" y="950" width="500" height="40" fill="#070b11"/>
    <rect x="220" y="990" width="560" height="30" fill="#05080d"/>
    <!-- steps -->
    <g fill="#0a1018">
      <rect x="300" y="1020" width="400" height="18"/>
      <rect x="280" y="1038" width="440" height="18"/>
      <rect x="260" y="1056" width="480" height="18"/>
      <rect x="240" y="1074" width="520" height="18"/>
      <rect x="220" y="1092" width="560" height="18"/>
    </g>
    <!-- path light -->
    <path d="M500 1110 L430 1200 H570 Z" fill="#d98a4a" opacity="0.08"/>
  </g>

  <!-- small red accent / lantern -->
  <g>
    <rect x="150" y="900" width="6" height="120" fill="#1a0f0c"/>
    <rect x="132" y="880" width="42" height="30" rx="4" fill="#7a2f24"/>
    <rect x="138" y="886" width="30" height="18" rx="2" fill="#d97745" opacity="0.8"/>
  </g>

  <!-- rain -->
  <g stroke="#b9c9d8" stroke-width="1" opacity="0.12">
    <line x1="80" y1="200" x2="40" y2="300"/>
    <line x1="180" y1="160" x2="140" y2="260"/>
    <line x1="300" y1="240" x2="260" y2="340"/>
    <line x1="420" y1="180" x2="380" y2="280"/>
    <line x1="540" y1="260" x2="500" y2="360"/>
    <line x1="660" y1="200" x2="620" y2="300"/>
    <line x1="800" y1="260" x2="760" y2="360"/>
    <line x1="900" y1="180" x2="860" y2="280"/>
    <line x1="120" y1="520" x2="80" y2="620"/>
    <line x1="260" y1="560" x2="220" y2="660"/>
    <line x1="400" y1="500" x2="360" y2="600"/>
    <line x1="560" y1="560" x2="520" y2="660"/>
    <line x1="720" y1="520" x2="680" y2="620"/>
    <line x1="860" y1="560" x2="820" y2="660"/>
  </g>

  <!-- grain -->
  <rect width="1000" height="1200" filter="url(#grain)" opacity="0.5"/>

  <!-- caption -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e8dcc8">
    <text x="60" y="1120" font-size="13" letter-spacing="0.18em" opacity="0.7">01 · НОЧНАЯ СМЕНА</text>
    <text x="60" y="1150" font-size="11" letter-spacing="0.12em" opacity="0.45">СИСТЕМЫ · ДАННЫЕ · СВЕТ</text>
  </g>
</svg>
