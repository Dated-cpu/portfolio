<svg xmlns="http://www.w3.org/2000/svg" width="820" height="880" viewBox="0 0 820 880" role="img" aria-label="Мультимодальный AI-ассистент в Telegram">
  <defs>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="820" height="880" fill="none"/>
  <circle cx="700" cy="760" r="190" fill="#22d3ee" opacity="0.05"/>
  <circle cx="80" cy="100" r="170" fill="#8b5cf6" opacity="0.06"/>

  <g filter="url(#panelShadow)">
    <rect x="30" y="50" width="760" height="760" rx="30" fill="#0e1621" stroke="#1f3349"/>
  </g>

  <!-- header -->
  <rect x="30" y="50" width="760" height="92" rx="30" fill="#132233"/>
  <rect x="30" y="112" width="760" height="30" fill="#132233"/>
  <line x1="30" y1="142" x2="790" y2="142" stroke="#1f3349"/>
  <rect x="52" y="74" width="44" height="44" rx="14" fill="url(#bot)"/>
  <text x="74" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">AI</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="110" y="94" font-size="15" font-weight="700" fill="#eef6ff">AI-ассистент</text>
    <text x="110" y="114" font-size="10.5" fill="#7f9bb5">online · текст · голос · фото · /image</text>
    <rect x="640" y="76" width="120" height="30" rx="15" fill="#0c1826" stroke="#23415e"/>
    <circle cx="656" cy="91" r="3.5" fill="#34d399"/>
    <text x="666" y="95" font-size="10.5" font-weight="600" fill="#9fc3e0">4 режима</text>
  </g>

  <!-- message: text -->
  <text x="470" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.4" fill="#4f6f8c" text-anchor="end">ТЕКСТ</text>
  <g filter="url(#soft)">
    <rect x="454" y="190" width="306" height="56" rx="18" fill="#2b5278"/>
  </g>
  <text x="472" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff">Сделай постер про n8n и AI</text>
  <text x="472" y="233" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#b9d3ea">вертикальный, 9:16</text>

  <!-- image result -->
  <text x="60" y="272" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.4" fill="#4f6f8c">IMAGE</text>
  <g filter="url(#soft)">
    <rect x="60" y="282" width="330" height="232" rx="20" fill="url(#poster)" stroke="#4c3fa0"/>
  </g>
  <circle cx="130" cy="350" r="54" fill="#ffffff" opacity="0.08"/>
  <circle cx="330" cy="440" r="78" fill="#22d3ee" opacity="0.12"/>
  <g opacity="0.9" fill="none" stroke="#ffffff" stroke-width="1.2">
    <path d="M90 470 C 150 400, 210 500, 270 420 S 340 360, 370 400"/>
    <path d="M90 486 C 160 430, 210 520, 280 450 S 340 400, 370 430" opacity="0.5"/>
  </g>
  <text x="86" y="326" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">GENERATED</text>
  <text x="86" y="372" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">n8n × AI</text>
  <text x="86" y="396" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#dbeafe">automation poster · vertical 9:16</text>
  <text x="86" y="486" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#dbeafe" opacity="0.8">gemini-3.1-flash-image</text>
  <rect x="86" y="430" width="92" height="24" rx="12" fill="#ffffff" opacity="0.14"/>
  <text x="132" y="446" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">сгенерировано</text>

  <!-- voice -->
  <text x="760" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.4" fill="#4f6f8c" text-anchor="end">ГОЛОС</text>
  <g filter="url(#soft)">
    <rect x="454" y="558" width="306" height="62" rx="18" fill="#2b5278"/>
  </g>
  <circle cx="482" cy="589" r="16" fill="#7dd3fc"/>
  <path d="M478 581 L491 589 L478 597 Z" fill="#12314a"/>
  <g stroke="url(#wave)" stroke-width="2.4" stroke-linecap="round">
    <line x1="512" y1="583" x2="512" y2="595"/>
    <line x1="522" y1="578" x2="522" y2="600"/>
    <line x1="532" y1="585" x2="532" y2="593"/>
    <line x1="542" y1="576" x2="542" y2="602"/>
    <line x1="552" y1="582" x2="552" y2="596"/>
    <line x1="562" y1="579" x2="562" y2="599"/>
    <line x1="572" y1="585" x2="572" y2="593"/>
    <line x1="582" y1="581" x2="582" y2="597"/>
    <line x1="592" y1="586" x2="592" y2="592"/>
    <line x1="602" y1="583" x2="602" y2="595"/>
    <line x1="612" y1="580" x2="612" y2="598"/>
  </g>
  <text x="634" y="594" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#dbeafe">0:07</text>

  <!-- bot answer -->
  <g filter="url(#soft)">
    <rect x="60" y="650" width="426" height="84" rx="18" fill="#182533"/>
  </g>
  <text x="80" y="678" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#eef6ff">Голос → текст → ответ</text>
  <text x="80" y="698" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9fb6cc">Расшифровал аудио и ответил в одном запросе.</text>
  <text x="80" y="716" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9fb6cc">Без отдельного сервиса распознавания речи.</text>

  <!-- input -->
  <rect x="50" y="752" width="720" height="46" rx="23" fill="#17212b" stroke="#23384d"/>
  <text x="74" y="780" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#5f7d96">Сообщение</text>
  <g transform="translate(722 766)" fill="none" stroke="#7fd1f7" stroke-width="1.6">
    <rect x="0" y="5" width="8" height="12" rx="4"/>
    <path d="M-3 12 C-3 20, 11 20, 11 12"/>
    <line x1="4" y1="20" x2="4" y2="24"/>
  </g>

  <!-- top badges -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">
    <rect x="30" y="10" width="120" height="30" rx="15" fill="#0f1624" stroke="#2a3a50"/>
    <circle cx="48" cy="25" r="3.5" fill="#ea4b71"/>
    <text x="58" y="29" fill="#cfe3f7">25 n8n nodes</text>
    <rect x="660" y="10" width="130" height="30" rx="15" fill="#0f1624" stroke="#2a3a50"/>
    <circle cx="678" cy="25" r="3.5" fill="#34d399"/>
    <text x="688" y="29" fill="#cfe3f7">3 AI models</text>
  </g>
</svg>
