<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-label="Архитектура AI Request Desk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e1a"/>
      <stop offset="1" stop-color="#0d1b2f"/>
    </linearGradient>
    <linearGradient id="n8n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221a3d"/>
      <stop offset="1" stop-color="#17152e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d6b8a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1100" height="440" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="160" fill="#22d3ee" opacity="0.05"/>
  <circle cx="60" cy="400" r="170" fill="#a78bfa" opacity="0.05"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="40" y="45" fill="#e6f1ff" font-size="20" font-weight="700">AI Request Desk · архитектура</text>
    <text x="40" y="67" fill="#7f93ad" font-size="12">один Telegram webhook · две ветки · дешёвая классификация · SQL как источник правды</text>

    <!-- Telegram -->
    <g filter="url(#shadow)">
      <rect x="40" y="160" width="180" height="110" rx="16" fill="#10233a" stroke="#245078"/>
    </g>
    <text x="60" y="192" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.2">ИСТОЧНИК</text>
    <text x="60" y="218" fill="#e6f1ff" font-size="16" font-weight="700">Telegram</text>
    <text x="60" y="240" fill="#8ba1bb" font-size="11">message + callback_query</text>
    <text x="60" y="256" fill="#5f748c" font-size="10">один webhook на бота</text>

    <!-- n8n -->
    <g filter="url(#shadow)">
      <rect x="290" y="130" width="230" height="170" rx="18" fill="url(#n8n)" stroke="#5b3fa0"/>
    </g>
    <text x="312" y="162" fill="#c4b5fd" font-size="11" font-weight="700" letter-spacing="1.2">ОРКЕСТРАЦИЯ</text>
    <text x="312" y="190" fill="#f3f8ff" font-size="18" font-weight="700">n8n workflow</text>
    <g font-size="10" fill="#b9c6e6">
      <rect x="312" y="204" width="186" height="20" rx="6" fill="#1d2447"/>
      <text x="322" y="218">normalize · trace_id</text>
      <rect x="312" y="229" width="186" height="20" rx="6" fill="#1d2447"/>
      <text x="322" y="243">validate JSON · fallback</text>
      <rect x="312" y="254" width="186" height="20" rx="6" fill="#1d2447"/>
      <text x="322" y="268">route · callbacks · totals</text>
    </g>

    <!-- OpenRouter -->
    <g filter="url(#shadow)">
      <rect x="600" y="52" width="210" height="104" rx="16" fill="#102a24" stroke="#1f6b53"/>
    </g>
    <text x="620" y="82" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="1.2">AI</text>
    <text x="620" y="108" fill="#e6f1ff" font-size="16" font-weight="700">OpenRouter</text>
    <text x="620" y="128" fill="#8ba1bb" font-size="11">qwen/qwen3.7-flash</text>
    <text x="620" y="144" fill="#5f748c" font-size="10">~$0.00002–0.00004 / заявка</text>

    <!-- PostgreSQL -->
    <g filter="url(#shadow)">
      <rect x="600" y="264" width="210" height="104" rx="16" fill="#2a2412" stroke="#7a6120"/>
    </g>
    <text x="620" y="294" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1.2">ДАННЫЕ</text>
    <text x="620" y="320" fill="#e6f1ff" font-size="16" font-weight="700">PostgreSQL</text>
    <text x="620" y="340" fill="#8ba1bb" font-size="11">заявка · SLA · стоимость</text>
    <text x="620" y="356" fill="#5f748c" font-size="10">enum · indexes · views</text>

    <!-- Manager -->
    <g filter="url(#shadow)">
      <rect x="870" y="52" width="190" height="104" rx="16" fill="#10233a" stroke="#245078"/>
    </g>
    <text x="890" y="82" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.2">МЕНЕДЖЕР</text>
    <text x="890" y="108" fill="#e6f1ff" font-size="15" font-weight="700">Карточка</text>
    <text x="890" y="128" fill="#8ba1bb" font-size="11">в работу / закрыть / спам</text>
    <text x="890" y="144" fill="#5f748c" font-size="10">editMessageText</text>

    <!-- Client -->
    <g filter="url(#shadow)">
      <rect x="870" y="264" width="190" height="104" rx="16" fill="#10233a" stroke="#245078"/>
    </g>
    <text x="890" y="294" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.2">КЛИЕНТ</text>
    <text x="890" y="320" fill="#e6f1ff" font-size="15" font-weight="700">Подтверждение</text>
    <text x="890" y="340" fill="#8ba1bb" font-size="11">«Заявка #N принята»</text>
    <text x="890" y="356" fill="#5f748c" font-size="10">категория · приоритет</text>

    <!-- arrows -->
    <line x1="220" y1="215" x2="288" y2="215" stroke="#4d6b8a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="229" y="203" fill="#7f93ad" font-size="10">update</text>

    <path d="M 520 190 C 560 190 560 120 598 112" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="536" y="132" fill="#6ee7b7" font-size="10">текст → JSON</text>

    <path d="M 598 140 C 566 150 560 210 522 214" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="524" y="170" fill="#6ee7b7" font-size="10">category</text>

    <line x1="520" y1="240" x2="598" y2="296" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="530" y="286" fill="#fbbf24" font-size="10">INSERT + SLA</text>

    <path d="M 810 296 C 848 296 848 170 868 140" fill="none" stroke="#4d6b8a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="818" y="250" fill="#7f93ad" font-size="10">карточка</text>

    <path d="M 810 330 C 840 330 840 316 868 316" fill="none" stroke="#4d6b8a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="816" y="342" fill="#7f93ad" font-size="10">ack</text>

    <path d="M 868 84 C 820 84 820 150 522 198" fill="none" stroke="#8b7ac9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="700" y="190" fill="#a99be0" font-size="10">callback: st:&lt;id&gt;:&lt;status&gt;</text>

    <text x="40" y="408" fill="#5f748c" font-size="10">Секреты — в credentials n8n. Заявка не теряется при ошибке LLM: fallback + needs_review.</text>
  </g>
</svg>
